workflows:
  native-ios-workflow:
    name: Native iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: Siyaphila-main/Siyaphila
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Build Native iOS App
        script: |
          xcode-project build-ipa \
            --project Siyaphila.xcodeproj \
            --scheme Siyaphila
    artifacts:
      - build/ios/ipa/*.ipa
